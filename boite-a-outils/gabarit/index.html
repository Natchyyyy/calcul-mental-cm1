<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gabarit 3D</title>
<!-- Point de départ d'un petit monde 3D : scène three.js, caméra qui tourne autour (souris), un modèle Meshy, des sons.
     ?manual=1 : pas d'animation automatique, window.API.step(n, dt) fait avancer le temps (pour capture.py). -->
<style>html,body{margin:0;height:100%;background:#0d1016;overflow:hidden;font:15px system-ui,sans-serif;color:#eef}
#ui{position:fixed;left:16px;bottom:16px;padding:8px 14px;border-radius:12px;background:rgba(0,0,0,.45);display:flex;gap:10px;align-items:center}
button{font:700 14px system-ui;border:0;border-radius:99px;padding:7px 14px;background:#f2c46a;color:#2a1a06;cursor:pointer}</style>
<div id="ui"><button id="mode" type="button">Se promener</button> <span id="aide">Glisse pour tourner · molette pour zoomer · clique sur la plante</span></div>
<script src="vendor/three.min.js"></script><script src="vendor/three-ex.js"></script>
<script src="../modeles3d/chargeur.js"></script><script src="../sons/lecteur.js"></script><script src="../promenade/promenade.js"></script>
<script>
const X = THREEX, q = new URLSearchParams(location.search), manual = q.get("manual") === "1";
const renderer = new THREE.WebGLRenderer({antialias: true}); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1a2233); scene.fog = new THREE.Fog(0x1a2233, 12, 30);
const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new X.RoomEnvironment(), .04).texture;
const cam = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 100); cam.position.set(4, 3, 6);
const orbit = new X.OrbitControls(cam, renderer.domElement); orbit.target.set(0, .6, 0); orbit.enableDamping = true; orbit.maxPolarAngle = Math.PI*.48; orbit.update();
// lumière chaude du soir + ciel froid
const sun = new THREE.DirectionalLight(0xffd6a0, 2.2); sun.position.set(5, 8, 3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); scene.add(sun);
scene.add(new THREE.HemisphereLight(0x9fb8ff, 0x2a1d14, .6));
// sol : une petite île d'herbe
const ground = new THREE.Mesh(new THREE.CylinderGeometry(5, 5.4, .6, 64), new THREE.MeshStandardMaterial({color: 0x4d7a3e, roughness: .95})); ground.position.y = -.3; ground.receiveShadow = true; scene.add(ground);
let plante = null;
Modeles.charger(["d_buis"]).then(() => {
  plante = Modeles.copie("d_buis", 1.4, 1.8) || new THREE.Mesh(new THREE.SphereGeometry(.7, 24, 16), new THREE.MeshStandardMaterial({color: 0x3f7a3a}));   // secours si le modèle manque
  scene.add(plante); P.cibles.push(plante); P.cercles.push([0, 0, .55]); window.PRET = true;
});
// promenade à la première personne (ZQSD, souris, E pour interagir, + / − pour la vitesse de la souris)
const P = Promenade(cam, renderer.domElement, {actif: false, limite: {type: "rond", r: 4.6},
  pas: p => Son.jouer("pas", {pan: p.cote*.2, varie: .03, vol: .6 + .4*p.force, reverb: .1}),
  interagir: () => { bounce = 1; Son.jouer("reussite", {reverb: .2}); }});
let marche = false; const btn = document.getElementById("mode"), aide = document.getElementById("aide");
btn.onclick = () => { marche = !marche; orbit.enabled = !marche; P.activer(marche); if(!marche){ cam.position.set(4, 3, 6); orbit.target.set(0, .6, 0); }
  btn.textContent = marche ? "Vue libre" : "Se promener"; aide.textContent = marche ? "Clique dans la scène · ZQSD pour marcher · souris pour regarder · E sur la plante · Échap pour libérer la souris" : "Glisse pour tourner · molette pour zoomer · clique sur la plante"; };
// clic sur la plante → petit son + rebond
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let bounce = 0;
renderer.domElement.addEventListener("click", e => { if(marche) return; ptr.set(e.clientX/innerWidth*2 - 1, -e.clientY/innerHeight*2 + 1); ray.setFromCamera(ptr, cam);
  if(plante && ray.intersectObject(plante, true).length){ bounce = 1; Son.jouer("reussite", {reverb: .2}); } else Son.jouer("clic"); });
addEventListener("resize", () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); });
let t = 0;
function tick(dt){ t += dt; if(marche) P.update(dt); else orbit.update(); if(plante){ bounce = Math.max(0, bounce - dt*2); const s = 1 + Math.sin(bounce*Math.PI*3)*.06*bounce; plante.scale.set(s, 1/s, s); } renderer.render(scene, cam); }
window.API = {step(n = 1, dt = 1/30){ for(let i = 0; i < n; i++) tick(dt); }, scene, cam, P, marcher(){ btn.click(); }};
if(!manual){ let last = performance.now(); renderer.setAnimationLoop(now => { tick(Math.min(.05, (now - last)/1000)); last = now; }); }
else API.step(1);
</script>
